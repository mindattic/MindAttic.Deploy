name: Build and deploy landing pages

on:
  push:
    branches: [main]
    paths:
      - 'projects.json'
      - 'template/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Single project slug to deploy (leave blank for all)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MindAttic.Deploy

      # Themes (Cyberspace CSS + body prelude + deps.json) live in
      # MindAttic.UiUx and are read off disk by src/build.js. Without this
      # sibling checkout, loadTheme() throws and no landing page renders.
      - uses: actions/checkout@v4
        with:
          repository: mindattic/MindAttic.UiUx
          path: MindAttic.UiUx
          token: ${{ secrets.SUBSCRIBER_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MindAttic.Deploy/package-lock.json

      - name: Install
        working-directory: MindAttic.Deploy
        run: npm ci

      - name: Deploy
        working-directory: MindAttic.Deploy
        env:
          MINDATTIC_FTP_JSON:      ${{ secrets.MINDATTIC_FTP_JSON }}
          SUBSCRIBER_REPO_TOKEN:   ${{ secrets.SUBSCRIBER_REPO_TOKEN }}
          # Pass the dispatch input through the environment, never interpolate it
          # directly into the shell — `${{ inputs.only }}` inline is a script-
          # injection vector (a crafted slug would execute on the runner).
          ONLY: ${{ inputs.only }}
        run: |
          themes="../MindAttic.UiUx/Themes"
          if [ -n "$ONLY" ]; then
            npm run deploy -- --from-github --themes-root "$themes" --only "$ONLY"
          else
            npm run deploy -- --from-github --themes-root "$themes"
          fi
