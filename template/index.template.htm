<!-- Contents drawer toggle (mobile/tablet). No-op when there is no TOC. -->
<script>
(function () {
  var toggle = document.querySelector('.toc-toggle');
  var toc = document.getElementById('doc-toc');
  if (!toggle || !toc) return;
  var backdrop = document.querySelector('.toc-backdrop');
  function setOpen(open) {
    document.body.classList.toggle('toc-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  toggle.addEventListener('click', function () {
    setOpen(!document.body.classList.contains('toc-open'));
  });
  if (backdrop) backdrop.addEventListener('click', function () { setOpen(false); });
  toc.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
}());
</script>
